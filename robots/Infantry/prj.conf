CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384

# enable GPIO subsystem
CONFIG_GPIO=y

# C++ config
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# CAN
CONFIG_CAN=y

#I2C
CONFIG_I2C=y

#PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y


#UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y

#Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

#Asserts
CONFIG_ASSERT=y

